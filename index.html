<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grade 2 Reading & Writing Practice Test</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#1f2937}
.wrap{max-width:760px;margin:auto;padding:18px}
.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 18px #00000012}
h1{font-size:28px;margin:0 0 8px;color:#174ea6} h2{font-size:20px;color:#166534}
label{font-weight:700;display:block;margin:12px 0 6px}
input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
.q{padding:13px 0;border-bottom:1px solid #e5e7eb}.q:last-child{border:0}
.opts label{font-weight:400}.opts input{margin-right:8px}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#1769e0;color:#fff;font-size:18px;font-weight:700}
#result{display:none;text-align:center;background:#eef6ff}.score{font-size:42px;font-weight:800;color:#1769e0}
small{color:#64748b}.error{color:#b91c1c;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>📚 Grade 2 Reading & Writing Practice</h1>
<p><b>Term 1 – Final Test Practice</b></p>
<p>30 questions • 30 marks</p>
<label>Student Name</label><input id="name" type="text" placeholder="Type your name">
</div>

<div class="card"><h2>Part 1: My Free Time — Questions 1–10</h2>
<p><small>For 1–6, rearrange the words. For 7–10, choose the correct answer.</small></p>
<div id="part1"></div></div>

<div class="card"><h2>Part 2: Living Spaces — Questions 11–20</h2>
<div id="part2"></div></div>

<div class="card"><h2>Part 3: Getting Dressed — Questions 21–30</h2>
<div id="part3"></div></div>

<div class="card"><button onclick="submitQuiz()">Submit & See My Score</button></div>
<div class="card" id="result"><div id="resultText"></div><button onclick="location.reload()" style="margin-top:14px">Try Again</button></div>
</div>

<script>
const qs=[
{n:1,type:'text',p:'play / I / with / my / friends',a:['i play with my friends']},
{n:2,type:'text',p:'does / What / he / do / after school',a:['what does he do after school']},
{n:3,type:'text',p:'the / read / library / books / at / We',a:['we read books at the library']},
{n:4,type:'text',p:'likes / Jane / drawing / pictures',a:['jane likes drawing pictures']},
{n:5,type:'text',p:'on / football / Sundays / They / play',a:['they play football on sundays']},
{n:6,type:'text',p:'your / What / favourite / is / activity',a:['what is your favourite activity']},
{n:7,type:'mc',p:'What do you do in your free time?',o:['I play games.','It is Monday.','It is in the kitchen.'],a:0},
{n:8,type:'mc',p:'How many days a week does Tom swim?',o:['Blue.','Three days.','In the bedroom.'],a:1},
{n:9,type:'mc',p:'What is Anna’s favourite activity?',o:['Reading books.','At school.','Two hours.'],a:0},
{n:10,type:'mc',p:'When does Ben ride his bike?',o:['On Saturdays.','In the bathroom.','A jacket.'],a:0},
{n:11,type:'mc',p:'Bedroom — what do we do here?',o:['We cook food here.','We sleep here.','We wash our bodies here.'],a:1},
{n:12,type:'mc',p:'Kitchen — what do we do here?',o:['We cook food here.','We sleep here.','We watch television here.'],a:0},
{n:13,type:'mc',p:'Bathroom — what do we do here?',o:['We cook food here.','We wash our bodies here.','We enjoy the view here.'],a:1},
{n:14,type:'mc',p:'Living room — what do we do here?',o:['We watch television here.','We cook food here.','We sleep here.'],a:0},
{n:15,type:'mc',p:'Balcony — what can we do here?',o:['Enjoy the view.','Cook food.','Wash our bodies.'],a:0},
{n:16,type:'mc',p:'Is there a bed in the bedroom?',o:['Yes, there is.','Yes, there are.','No, there aren’t.'],a:0},
{n:17,type:'mc',p:'Is there a cooker in the kitchen?',o:['No, there isn’t.','Yes, there is.','Yes, there are.'],a:1},
{n:18,type:'mc',p:'Are there chairs in the dining room?',o:['Yes, there are.','No, there isn’t.','Yes, there is.'],a:0},
{n:19,type:'mc',p:'Are there books in the bathroom?',o:['Yes, there is.','No, there aren’t.','No, there isn’t.'],a:1},
{n:20,type:'mc',p:'Which room do you use to watch TV?',o:['Living room.','Bathroom.','Balcony.'],a:0},
{n:21,type:'text',p:'You wear this on your head.',a:['hat']},
{n:22,type:'text',p:'You wear these on your feet.',a:['shoes']},
{n:23,type:'text',p:'You wear this when it is cold.',a:['coat','jacket']},
{n:24,type:'text',p:'You wear these on your legs.',a:['trousers','pants']},
{n:25,type:'text',p:'You wear this over a shirt.',a:['jacket']},
{n:26,type:'mc',p:'Which one is a piece of clothing?',o:['T-shirt','Kitchen','Balcony'],a:0},
{n:27,type:'mc',p:'What do you wear on your feet?',o:['Shoes','Hat','Scarf'],a:0},
{n:28,type:'mc',p:'What do you wear when it is cold?',o:['Coat','Shorts','Swimsuit'],a:0},
{n:29,type:'mc',p:'Which word is plural?',o:['Shirt','Shoes','Jacket'],a:1},
{n:30,type:'mc',p:'Choose the correct sentence.',o:['I am wearing a blue shirt.','I wearing blue shirt.','I is wearing a blue shirt.'],a:0}
];
function norm(s){return s.toLowerCase().trim().replace(/[.!?,]/g,'').replace(/\s+/g,' ')}
function render(list,id){document.getElementById(id).innerHTML=list.map(q=>{
 if(q.type==='text') return '<div class="q"><b>'+q.n+'.</b> '+q.p+'<input id="q'+q.n+'" type="text" placeholder="Type your answer"></div>';
 return '<div class="q"><b>'+q.n+'.</b> '+q.p+'<div class="opts">'+q.o.map((x,i)=>'<label><input type="radio" name="q'+q.n+'" value="'+i+'">'+String.fromCharCode(97+i)+') '+x+'</label>').join('')+'</div></div>';
}).join('')}
render(qs.slice(0,10),'part1');render(qs.slice(10,20),'part2');render(qs.slice(20),'part3');
function submitQuiz(){
 const name=document.getElementById('name').value.trim();
 if(!name){alert('Please enter the student name.');document.getElementById('name').focus();return}
 let score=0;
 qs.forEach(q=>{
  if(q.type==='text'){const v=norm(document.getElementById('q'+q.n).value);if(q.a.map(norm).includes(v))score++}
  else {const el=document.querySelector('input[name="q'+q.n+'"]:checked');if(el&&Number(el.value)===q.a)score++}
 });
 const pct=Math.round(score/30*100);
 document.getElementById('resultText').innerHTML='<h2>🎉 Test Complete!</h2><p><b>'+name+'</b></p><div class="score">'+score+' / 30</div><p>'+pct+'%</p><p>'+ (score===30?'Excellent! 🌟':score>=24?'Great job! 👍':score>=18?'Good work! 😊':'Keep practising! 💪') +'</p>';
 document.getElementById('result').style.display='block';
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
</script>
</body></html>
